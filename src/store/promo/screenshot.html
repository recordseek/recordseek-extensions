<!doctype html>
<!-- 1280x800 store screenshots. Open with ?shot=main|source|search|attach|citation.
     App captures in screens/ come from screens/capture-app.py (local dev server). -->
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root { --primary: #006642; --accent: #daf0e0; --paper: #f0ede6; --ink: #1c2b23; --ink-soft: #3c4c41; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 800px; overflow: hidden; background: var(--paper); font-family: 'DM Sans', sans-serif; }
  .stage { position: relative; width: 1280px; height: 800px; overflow: hidden; }
  .stage::before { content: ''; position: absolute; width: 1100px; height: 1100px; left: 50%; top: 120px;
                   transform: translateX(-50%); border-radius: 50%;
                   background: radial-gradient(closest-side, var(--accent), rgba(218,240,224,0)); }
  .head { position: relative; display: flex; align-items: flex-start; gap: 22px; padding: 48px 110px 0; }
  .head img { width: 52px; height: 52px; flex: none; margin-top: 4px; }
  h1 { font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 40px; letter-spacing: -0.025em; color: var(--ink); line-height: 1.1; }
  h1 em { font-style: normal; color: var(--primary); }
  p { margin-top: 10px; font-size: 20px; line-height: 1.4; color: var(--ink-soft); max-width: 1000px; }
  .frame { position: absolute; left: 110px; right: 110px; top: 172px; background: #fff; border-radius: 14px 14px 0 0;
           box-shadow: 0 30px 70px rgba(28,43,35,.18), 0 2px 8px rgba(28,43,35,.08); overflow: hidden; }
  .bar { display: flex; gap: 7px; align-items: center; padding: 12px 16px; background: #f7f5f0; border-bottom: 1px solid #e7e3da; }
  .bar i { width: 11px; height: 11px; border-radius: 50%; background: #ddd7cb; display: block; }
  .bar .url { margin-left: 12px; flex: 1; height: 26px; border-radius: 13px; background: #fff; border: 1px solid #e7e3da;
              font-size: 13px; color: #6f766f; display: flex; align-items: center; padding: 0 14px; }
  .shot { display: block; width: 100%; height: 640px; object-fit: cover; object-position: top; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  const shots = {
    main:     ['Click once on <em>any record.</em>', 'RecordSeek opens with the page ready to save to FamilySearch, Ancestry or anywhere else.'],
    source:   ['A proper citation, <em>written for you.</em>', 'Title, link and citation filled in, in Evidence Explained, Chicago, MLA and more.'],
    search:   ['It reads the record, <em>so you don’t have to.</em>', 'Names, dates, places and family members from the page pre-fill your FamilySearch search.'],
    attach:   ['Attach it to <em>the right person.</em>', 'Tag the events it proves, add your reason, and choose whether it also goes in your Source Box.'],
    citation: ['Or take the citation <em>anywhere.</em>', 'Copy a ready-made citation for your notes, genealogy software or research log.'],
  };
  const name = new URLSearchParams(location.search).get('shot') || 'main';
  const [title, sub] = shots[name];
  document.getElementById('root').innerHTML = `
    <div class="stage">
      <div class="head"><img src="mark.png" alt=""><div><h1>${title}</h1><p>${sub}</p></div></div>
      <div class="frame">
        <div class="bar"><i></i><i></i><i></i><div class="url">recordseek.com/share/</div></div>
        <img class="shot" src="screens/app-${name}.png" alt="">
      </div>
    </div>`;
</script>
</body>
</html>
